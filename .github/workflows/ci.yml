name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - codex/m13-installer-final-acceptance-authorized
      - codex/m14-preprod-foundation-authorized

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout the exact source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source head
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Expected $env:EXPECTED_SOURCE_SHA but checked out $actual." }
          "Exact source head: $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Test repository safety scanner
        shell: pwsh
        run: '& .github/scripts/Test-RepositorySafety.ps1 -SelfTest'
      - name: Scan tracked and non-ignored repository files
        shell: pwsh
        run: '& .github/scripts/Test-RepositorySafety.ps1'
      - name: Test M14 immutable candidate pipeline
        shell: pwsh
        run: '& .\installer\scripts\Test-M14-CandidatePipeline.ps1 -SelfTest'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Sushi81.Pos.sln
      - name: Audit direct and transitive NuGet vulnerabilities
        shell: pwsh
        run: '& .github/scripts/Audit-NuGetVulnerabilities.ps1'
      - name: Build
        run: dotnet build Sushi81.Pos.sln -c Release --no-restore
      - name: Test
        run: dotnet test Sushi81.Pos.sln -c Release --no-build --nologo

  m13-production-installer:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'codex/m13-installer-final-acceptance-authorized') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/m13-installer-final-acceptance-authorized'))
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout the exact production source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source and expose its identity
        id: source
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Expected exact source head $env:EXPECTED_SOURCE_SHA but checked out $actual." }
          $short = $actual.Substring(0, 7).ToLowerInvariant()
          "head=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Exact source head: $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install pinned Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $version = '6.7.3'
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-$($version.Replace('.', '_'))/innosetup-$version.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') { throw "Inno Setup Authenticode status is $($signature.Status)." }
          $publisher = [string]$signature.SignerCertificate.Subject
          if ($publisher -notmatch '(?i)Pyrsys B\.V\.') { throw "Unexpected Inno Setup signer '$publisher'." }
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed: $($install.ExitCode)." }
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not installed.' }
          # The compiler engine exposes its actual version through ISPP's Ver
          # predefined variable; sushi81-pos.iss checks that during compilation.
          # ISCC.exe itself has no useful Windows file-version resource.
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Pinned Inno Setup package: $version; signed publisher: $publisher" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Package and verify the production installer
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.head }}
          INNO_COMPILER_PATH: ${{ steps.inno.outputs.path }}
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/m13-wp4'
          & .\installer\scripts\Run-WP4-CI.ps1 `
            -ExpectedSourceSha $env:EXPECTED_SOURCE_SHA `
            -CompilerPath $env:INNO_COMPILER_PATH `
            -ArtifactDirectory $artifactDirectory
          if ($LASTEXITCODE -ne 0) { throw 'WP4 packaging/lifecycle verification failed.' }
      - name: Upload exact-head production installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: Sushi81-POS-production-installer-win-x64-1.0.0-${{ steps.source.outputs.short }}
          path: artifacts/m13-wp4/*
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact identity
        shell: pwsh
        run: |
          @(
            '',
            '## Durable production installer artifact',
            '',
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Run ID: $env:GITHUB_RUN_ID",
            "Artifact name: Sushi81-POS-production-installer-win-x64-1.0.0-${{ steps.source.outputs.short }}",
            "Artifact ID: ${{ steps.upload-installer.outputs.artifact-id }}",
            'Retention: 90 days'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  m14-wp2-dual-installer:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'codex/m14-preprod-foundation-authorized') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/m14-preprod-foundation-authorized')
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout the exact M14 source head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        id: source
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Expected exact source head $env:EXPECTED_SOURCE_SHA but checked out $actual." }
          $short = $actual.Substring(0, 7).ToLowerInvariant()
          "head=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Exact source head: $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install pinned Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $version = '6.7.3'
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-$($version.Replace('.', '_'))/innosetup-$version.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') { throw "Inno Setup Authenticode status is $($signature.Status)." }
          $publisher = [string]$signature.SignerCertificate.Subject
          if ($publisher -notmatch '(?i)Pyrsys B\.V\.') { throw "Unexpected Inno Setup signer '$publisher'." }
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed: $($install.ExitCode)." }
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not installed.' }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Pinned Inno Setup package: $version; signed publisher: $publisher" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Build and verify both installers
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.head }}
          INNO_COMPILER_PATH: ${{ steps.inno.outputs.path }}
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/m14-wp2'
          & .\installer\scripts\Run-M14-WP2-CI.ps1 `
            -ExpectedSourceSha $env:EXPECTED_SOURCE_SHA `
            -CompilerPath $env:INNO_COMPILER_PATH `
            -ArtifactDirectory $artifactDirectory
          if ($LASTEXITCODE -ne 0) { throw 'M14 WP2 dual-installer verification failed.' }
      - name: Upload exact-head M14 WP2 installer evidence
        uses: actions/upload-artifact@v7
        with:
          name: Sushi81-POS-M14-WP2-dual-installers-1.0.1-${{ steps.source.outputs.short }}
          path: artifacts/m14-wp2/*
          if-no-files-found: error
          retention-days: 90

  m14-wp6-promotion-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/m14-preprod-foundation-authorized'
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head
        id: source
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $env:EXPECTED_HEAD) { throw 'WP6 promotion checkout differs from PR head.' }
          "head=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Test WP6 promotion safeguards without rebuilding application
        shell: pwsh
        run: '& .\installer\scripts\Test-M14-ProductionPromotion.ps1 -SelfTest'
      - name: Install signed pinned Inno Setup 6.7.3
        id: inno
        shell: pwsh
        run: |
          $version = '6.7.3'
          $download = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-$($version.Replace('.', '_'))/innosetup-$version.exe" -OutFile $download
          $signature = Get-AuthenticodeSignature -FilePath $download
          if ($signature.Status -ne 'Valid' -or [string]$signature.SignerCertificate.Subject -notmatch '(?i)Pyrsys B\.V\.') { throw 'Pinned Inno Setup signer is invalid.' }
          $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Pinned Inno Setup installation failed.' }
          $candidates = @((Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Inno Setup 6\ISCC.exe'),(Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'))
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $compiler) { throw 'Pinned Inno Setup compiler is missing.' }
          "path=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build and verify Production promotion evidence from immutable C01
        shell: pwsh
        env:
          PROMOTION_HEAD: ${{ steps.source.outputs.head }}
          INNO_COMPILER: ${{ steps.inno.outputs.path }}
        run: |
          & .\installer\scripts\Promote-M14-Candidate.ps1 -Repository 'cimerosef/sushi81-pos' -CandidateTag 'v1.0.1-preprod-c01' -ExpectedReleaseId 398945249 -ExpectedSourceSha '95e2ead7d95af5fb47f6b162fde4d22d8ea47d82' -PromotionHead $env:PROMOTION_HEAD -CompilerPath $env:INNO_COMPILER -ArtifactDirectory (Join-Path $env:GITHUB_WORKSPACE 'artifacts/m14-wp6')
      - name: Upload exact-head M14 WP6 promotion evidence
        uses: actions/upload-artifact@v7
        with:
          name: Sushi81-POS-M14-WP6-promotion-evidence-${{ steps.source.outputs.head }}
          path: artifacts/m14-wp6/*
          if-no-files-found: error
          retention-days: 90
