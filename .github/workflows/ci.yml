name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - codex/m13-installer-final-acceptance-authorized

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout the exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source head
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Expected $env:EXPECTED_SOURCE_SHA but checked out $actual." }
          "Exact source head: $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Sushi81.Pos.sln
      - name: Build
        run: dotnet build Sushi81.Pos.sln -c Release --no-restore
      - name: Test
        run: dotnet test Sushi81.Pos.sln -c Release --no-build --nologo

  m13-production-installer:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'codex/m13-installer-final-acceptance-authorized') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/m13-installer-final-acceptance-authorized'))
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout the exact production source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source and expose its identity
        id: source
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Expected exact source head $env:EXPECTED_SOURCE_SHA but checked out $actual." }
          $short = $actual.Substring(0, 7).ToLowerInvariant()
          "head=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Exact source head: $actual" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $version = '6.7.3'
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
          $uri = "https://github.com/jrsoftware/issrc/releases/download/is-$($version.Replace('.', '_'))/innosetup-$version.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') { throw "Inno Setup Authenticode status is $($signature.Status)." }
          $publisher = [string]$signature.SignerCertificate.Subject
          if ($publisher -notmatch '(?i)Pyrsys B\.V\.') { throw "Unexpected Inno Setup signer '$publisher'." }
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed: $($install.ExitCode)." }
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe was not installed.' }
          $compilerVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($iscc).FileVersion
          if ($compilerVersion -notlike "$version*") { throw "Expected Inno Setup $version, found $compilerVersion." }
          "path=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Inno Setup: $compilerVersion; signed publisher: $publisher" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Package and verify the production installer
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.head }}
          INNO_COMPILER_PATH: ${{ steps.inno.outputs.path }}
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts/m13-wp4'
          & .\installer\scripts\Run-WP4-CI.ps1 `
            -ExpectedSourceSha $env:EXPECTED_SOURCE_SHA `
            -CompilerPath $env:INNO_COMPILER_PATH `
            -ArtifactDirectory $artifactDirectory
          if ($LASTEXITCODE -ne 0) { throw 'WP4 packaging/lifecycle verification failed.' }
      - name: Upload exact-head production installer
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: Sushi81-POS-production-installer-win-x64-1.0.0-${{ steps.source.outputs.short }}
          path: artifacts/m13-wp4/*
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact identity
        shell: pwsh
        run: |
          @(
            '',
            '## Durable production installer artifact',
            '',
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Run ID: $env:GITHUB_RUN_ID",
            "Artifact name: Sushi81-POS-production-installer-win-x64-1.0.0-${{ steps.source.outputs.short }}",
            "Artifact ID: ${{ steps.upload-installer.outputs.artifact-id }}",
            'Retention: 90 days'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
